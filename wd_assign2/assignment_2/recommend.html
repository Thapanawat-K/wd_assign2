<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Web development" />
  <meta name="keywords" content="Assignment 2" />
  <meta name="author" content="Thapanawat Kittisiddho" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommend - Restaurant App</title>
  <link rel="stylesheet" href="../design/css/style.css" />
  <script src="../design/js/script.js"></script>
</head>
<body>

  <!-- nav -->
  <header class="site-header">
    <div class="header-inner">
      <span>Navigation</span>
    </div>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
        <li><a href="recommend.html" class="active">Recommend</a></li>
        <li><a href="register.html">Sign Up</a></li>
        <li><a href="reservation.html">Reserve</a></li>
        <li><a href="bill.html">Bill</a></li>
      </ul>
    </nav>
  </header>

  <!--banner -->
  <section class="banner">
    <div class="banner-content">
      <h1>Get a Recommendation</h1>
      <p>Tell us what you're after and we'll match you with the perfect spot.</p>
    </div>
  </section>

  <!--form -->
  <section class="content">
    <form id="recommendForm" class="form">

      <div class="form-group">
        <label for="dietary">Dietary Preference</label>
        <select id="dietary" name="dietary">
          <option value="none">No preference</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="halal">Halal</option>
          <option value="glutenfree">Gluten-free</option>
        </select>
      </div>

      <div class="form-group">
        <label>Budget per person</label>
        <div class="radio-group">
          <label><input type="radio" name="budget" value="low" checked /> Under $20</label>
          <label><input type="radio" name="budget" value="mid" /> $20 - $30</label>
          <label><input type="radio" name="budget" value="high" /> $30+</label>
        </div>
      </div>

      <div class="form-group">
        <label for="purpose">Dining Purpose</label>
        <select id="purpose" name="purpose">
          <option value="casual">Casual / Quick bite</option>
          <option value="family">Family dinner</option>
          <option value="date">Date night</option>
          <option value="business">Business lunch</option>
          <option value="tourist">Visiting Melbourne</option>
        </select>
      </div>

      <button type="button" class="btn" id="recommendBtn">Find my restaurant</button>
    </form>

    <div id="recommendResult" class="recommend-result"></div>
  </section>

  <footer>
    <p>2026 Unnamed Restaurant App</p>
  </footer>

</body>
</html>
