  <link rel="stylesheet" href="../design/css/style.css" />
  <script src="../design/js/script.js"></script>
</head>
<body>

  <!-- nav -->
  <header class="site-header">
    <div class="header-inner">
      <span>Navigation</span>
    </div>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
        <li><a href="recommend.html">Recommend</a></li>
        <li><a href="register.html" class="active">Sign Up</a></li>
        <li><a href="reservation.html">Reserve</a></li>
        <li><a href="bill.html">Bill</a></li>
      </ul>
    </nav>
  </header>

  <!-- banner -->
  <section class="banner">
    <div class="banner-content">
      <h1>Sign Up</h1>
      <p>Create an account to start booking restaurants.</p>
    </div>
  </section>

  <!--form -->
  <section class="content">
    <form id="regform" class="form" method="post"
          action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php">

      <fieldset>
        <legend>Account Information</legend>

        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" name="username" />
          <small class="error" id="err-username"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" type="email" name="email" />
          <small class="error" id="err-email"></small>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" name="phone" />
          <small class="error" id="err-phone"></small>
        </div>

        <div class="form-group">
          <label for="pwd1">Password</label>
          <input id="pwd1" type="password" name="pwd1" />
          <small class="error" id="err-pwd1"></small>
        </div>

        <div class="form-group">
          <label for="pwd2">Confirm Password</label>
          <input id="pwd2" type="password" name="pwd2" />
          <small class="error" id="err-pwd2"></small>
        </div>
      </fieldset>

      <fieldset>
        <legend>User Information</legend>

        <div class="form-group">
          <span class="radiolabel">Gender</span>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="M" /> Male</label>
            <label><input type="radio" name="gender" value="F" /> Female</label>
            <label><input type="radio" name="gender" value="O" /> Other</label>
          </div>
          <small class="error" id="err-gender"></small>
        </div>

        <div class="form-group">
          <label for="dietary">Dietary Preferences</label>
          <select id="dietary" name="dietary">
            <option value="none">No preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="halal">Halal</option>
            <option value="glutenfree">Gluten-free</option>
          </select>
        </div>

        <div class="form-group">
          <label for="country">Country / Region</label>
          <select id="country" name="country">
            <option value="">-- Select --</option>
            <option value="AU">Australia</option>
            <option value="NZ">New Zealand</option>
            <option value="US">United States</option>
            <option value="UK">United Kingdom</option>
            <option value="CN">China</option>
            <option value="JP">Japan</option>
            <option value="TH">Thailand</option>
            <option value="IN">India</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
      </fieldset>

      <div class="form-group">
        <button type="submit" class="btn">Register</button>
      </div>
    </form>
  </section>

  <footer>
    <p>2026 Unnamed Restaurant App</p>
  </footer>

</body>
</html>
