<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Calculator - Restaurant App</title>
  <link rel="stylesheet" href="../design/css/style.css" />
  <script src="../design/js/script.js"></script>
</head>
<body>

  <!-- Nav -->
  <header class="site-header">
    <div class="header-inner">
      <span>Navigation</span>
    </div>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>
        <li><a href="recommend.html">Recommend</a></li>
        <li><a href="register.html">Sign Up</a></li>
        <li><a href="reservation.html">Reserve</a></li>
        <li><a href="bill.html" class="active">Bill</a></li>
      </ul>
    </nav>
  </header>

  <!--banner -->
  <section class="banner">
    <div class="banner-content">
      <h1>Bill Calculator</h1>
      <p>Estimate the total cost of your meal.</p>
    </div>
  </section>

  <!--form -->
  <section class="content">
    <div class="form">

      <div class="form-group">
        <label for="billRestaurant">Restaurant</label>
        <select id="billRestaurant">
          <option value="">-- Select a restaurant --</option>
          <option value="20">Dainty Sichuan Noodles QV</option>
          <option value="22">DoDee Paidang Swanston</option>
          <option value="35">Yappari Steak Swanston</option>
          <option value="25">Soi 38</option>
          <option value="15">Gopals</option>
          <option value="12">Udon Yasan</option>
        </select>
      </div>

      <div class="form-group">
        <label for="billPeople">Number of People</label>
        <input id="billPeople" type="number" min="1" value="2" />
      </div>

      <div class="form-group">
        <button type="button" class="btn" id="billBtn">Calculate</button>
      </div>

      <div id="billResult" class="bill-result"></div>

    </div>
  </section>

  <footer>
    <p>2026 Unnamed Restaurant App</p>
  </footer>

</body>
</html>
